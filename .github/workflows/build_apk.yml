name: Build Kivy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf automake \
            libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev gettext libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip==24.0
        pip install --upgrade cython==0.29.36 buildozer

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.android
        echo '### License accepted automatically' > ~/.android/repositories.cfg

    - name: Build with Buildozer
      run: buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
